<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitura Dinâmica</title>
<style>
  :root {
    --bg-app: #1e1e24;
    --bg-panel: #2a2a33;
    --bg-input: #1a1a20;
    --fg: #eaeaea;
    --fg-dim: #a0a0b0;
    --accent: #4caf50;
    --accent-2: #2196f3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-app);
    color: var(--fg);
    height: 100%;
  }

  /* ---------- Painel de configuração ---------- */
  #config {
    max-width: 820px;
    margin: 0 auto;
    padding: 24px 20px 40px;
  }
  #config h1 {
    font-size: 1.6rem;
    margin: 0 0 6px;
  }
  #config p.sub {
    color: var(--fg-dim);
    margin: 0 0 20px;
    font-size: 0.95rem;
  }
  fieldset {
    border: 1px solid #3a3a45;
    border-radius: 10px;
    background: var(--bg-panel);
    padding: 12px 16px 16px;
    margin: 0 0 16px;
  }
  legend {
    padding: 0 6px;
    color: var(--fg-dim);
    font-size: 0.9rem;
  }
  label.field {
    display: block;
    margin: 8px 0 4px;
    font-size: 0.9rem;
  }
  input[type="text"], input[type="number"], textarea, select {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid #3a3a45;
    border-radius: 6px;
    color: var(--fg);
    padding: 8px 10px;
    font-size: 1rem;
    font-family: inherit;
  }
  textarea { min-height: 90px; resize: vertical; }
  input[type="color"] {
    width: 48px; height: 32px;
    border: 1px solid #3a3a45;
    border-radius: 6px;
    background: transparent;
    padding: 2px;
    vertical-align: middle;
  }
  .linha { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .linha > * { flex: 0 0 auto; }
  .check { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .check input { width: 18px; height: 18px; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 16px;
    font-size: 1rem;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }
  button.secundario {
    background: #3a3a45;
    color: var(--fg);
    font-weight: 500;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .botoes-acao { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  input[type="range"] { width: 180px; }

  /* ---------- Slide ---------- */
  #slide {
    position: fixed; inset: 0;
    display: none;
    background: #000;
    overflow: hidden;
  }
  #slide.ativo { display: block; }
  #canvas-slide {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }
  #controles-slide {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 12px 16px;
    background: linear-gradient(to top, rgba(0,0,0,0.65), rgba(0,0,0,0));
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    color: white;
    opacity: 0.35;
    transition: opacity 0.25s;
    font-size: 0.9rem;
  }
  #slide:hover #controles-slide { opacity: 1; }
  #controles-slide button {
    padding: 6px 12px;
    font-size: 0.9rem;
    background: rgba(255,255,255,0.15);
    color: white;
  }
  #controles-slide button:hover { background: rgba(255,255,255,0.3); }
  #contador {
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }
  #barra-progresso {
    position: absolute;
    top: 0; left: 0;
    height: 4px;
    background: var(--accent);
    width: 0%;
    transition: width 0.15s linear;
  }
  .dica {
    color: var(--fg-dim);
    font-size: 0.85rem;
    margin-top: 6px;
  }
  #status { color: var(--accent-2); font-size: 0.9rem; margin-top: 12px; min-height: 1em; }
</style>
</head>
<body>

<!-- ============ PAINEL DE CONFIGURAÇÃO ============ -->
<div id="config">
  <h1>Leitura Dinâmica</h1>
  <p class="sub">Digite palavras, escolha cores e abra o modo slide para a criança ler em voz alta.</p>

  <fieldset>
    <legend>Palavras</legend>
    <label class="field">Separe por vírgula (ou uma por linha):</label>
    <textarea id="palavras" placeholder="amor, esperança, paz, fé, gratidão, amizade"></textarea>
  </fieldset>

  <fieldset>
    <legend>Tamanho</legend>
    <div class="linha">
      <label class="field">Largura: <input type="number" id="largura" value="1080" min="200" max="4000" style="width:100px"></label>
      <label class="field">Altura:  <input type="number" id="altura"  value="1080" min="200" max="4000" style="width:100px"></label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Cores</legend>
    <div class="linha">
      <label class="field">Fundo: <input type="color" id="corFundo" value="#f5f0e6"></label>
      <label class="check"><input type="checkbox" id="fundoRand"> fundo aleatório</label>
    </div>
    <div class="linha">
      <label class="field">Texto: <input type="color" id="corTexto" value="#3c3c3c"></label>
      <label class="check"><input type="checkbox" id="textoRand"> texto aleatório</label>
    </div>
    <label class="field">Tom das cores aleatórias:</label>
    <select id="tom">
      <option value="pastel" selected>Pastel</option>
      <option value="suave">Suave</option>
      <option value="vivido">Vívido</option>
    </select>
  </fieldset>

  <fieldset>
    <legend>Imagem de fundo (opcional)</legend>
    <div class="linha">
      <input type="file" id="arquivoFundo" accept="image/*">
      <button class="secundario" type="button" id="btnRemoverFundo" disabled>Remover</button>
    </div>
    <label class="field" style="margin-top:10px">
      Intensidade do véu de cor:
      <input type="range" id="veu" min="0" max="1" step="0.05" value="0.55">
      <span id="veuValor">0.55</span>
    </label>
    <label class="check"><input type="checkbox" id="sombra" checked> Sombra no texto (útil sobre foto)</label>
  </fieldset>

  <fieldset>
    <legend>Modo slide</legend>
    <label class="field">Intervalo do auto-play (segundos):</label>
    <input type="number" id="intervalo" value="3" min="0.5" max="60" step="0.5" style="width:120px">
    <p class="dica">No slide: clique, use ← → ou espaço para trocar. F11 para tela cheia. ESC para voltar.</p>
  </fieldset>

  <div class="botoes-acao">
    <button id="btnIniciar">▶ Iniciar slide</button>
    <button class="secundario" id="btnBaixarTodas" disabled>⬇ Baixar todas (PNG)</button>
  </div>
  <div id="status"></div>
</div>

<!-- ============ SLIDE EM TELA CHEIA ============ -->
<div id="slide">
  <canvas id="canvas-slide"></canvas>
  <div id="barra-progresso"></div>
  <div id="controles-slide">
    <button id="btnAnterior" title="Anterior (←)">◀</button>
    <button id="btnAutoPlay" title="Auto-play (espaço)">▶ Auto</button>
    <button id="btnProximo" title="Próxima (→)">▶</button>
    <button id="btnBaixarAtual">⬇ Baixar</button>
    <button id="btnSair">✕ Sair (ESC)</button>
    <span id="contador">1 / 1</span>
  </div>
</div>

<script>
// =========================================================
//  Utilidades de cor
// =========================================================
function hlsToRgb(h, l, s) {
  // h, l, s em 0..1 — retorna [r,g,b] em 0..255
  const c = (1 - Math.abs(2*l - 1)) * s;
  const hp = h * 6;
  const x = c * (1 - Math.abs(hp % 2 - 1));
  let r=0, g=0, b=0;
  if (hp < 1) [r,g,b] = [c,x,0];
  else if (hp < 2) [r,g,b] = [x,c,0];
  else if (hp < 3) [r,g,b] = [0,c,x];
  else if (hp < 4) [r,g,b] = [0,x,c];
  else if (hp < 5) [r,g,b] = [x,0,c];
  else [r,g,b] = [c,0,x];
  const m = l - c/2;
  return [
    Math.round((r+m)*255),
    Math.round((g+m)*255),
    Math.round((b+m)*255)
  ];
}
const TONS_FUNDO = {
  pastel: {s:[0.20,0.45], l:[0.78,0.92]},
  suave:  {s:[0.40,0.65], l:[0.60,0.78]},
  vivido: {s:[0.70,1.00], l:[0.45,0.60]},
};
const TONS_TEXTO = {
  pastel: {s:[0.30,0.55], l:[0.65,0.78]},
  suave:  {s:[0.40,0.65], l:[0.40,0.55]},
  vivido: {s:[0.75,1.00], l:[0.30,0.45]},
};
const rand = (a,b) => a + Math.random()*(b-a);

function corAleatoria(tom, paraTexto) {
  const t = (paraTexto ? TONS_TEXTO : TONS_FUNDO)[tom];
  const h = Math.random();
  const s = rand(t.s[0], t.s[1]);
  const l = rand(t.l[0], t.l[1]);
  return hlsToRgb(h, l, s);
}
function rgbParaCss([r,g,b]) { return `rgb(${r},${g},${b})`; }
function hexParaRgb(hex) {
  const m = hex.match(/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i);
  return [parseInt(m[1],16), parseInt(m[2],16), parseInt(m[3],16)];
}

// =========================================================
//  Estado da aplicação
// =========================================================
const estado = {
  palavras: [],
  largura: 1080,
  altura: 1080,
  corFundo: [245,240,230],
  corTexto: [60,60,60],
  fundoRand: false,
  textoRand: false,
  tom: 'pastel',
  imagemFundo: null,   // HTMLImageElement
  veu: 0.55,
  sombra: true,
  intervalo: 3,
  // Cores sorteadas por imagem (fixas ao iniciar o slide)
  coresGeradas: [],    // [{fundo:[r,g,b], texto:[r,g,b]}]
  indiceAtual: 0,
  autoPlay: false,
  timerAuto: null,
};

// =========================================================
//  Elementos
// =========================================================
const el = id => document.getElementById(id);
const canvasSlide = el('canvas-slide');
const ctxSlide = canvasSlide.getContext('2d');

// =========================================================
//  Desenho de uma imagem no canvas fornecido
// =========================================================
function desenharImagem(ctx, w, h, palavra, cores, imagemFundo, veu, sombra) {
  // 1) fundo
  if (imagemFundo) {
    // cover: preenche o quadro mantendo proporção
    const razao = w / h;
    const razaoImg = imagemFundo.width / imagemFundo.height;
    let dw, dh, dx, dy;
    if (razaoImg > razao) {
      dh = h; dw = h * razaoImg;
      dx = (w - dw) / 2; dy = 0;
    } else {
      dw = w; dh = w / razaoImg;
      dx = 0; dy = (h - dh) / 2;
    }
    ctx.drawImage(imagemFundo, dx, dy, dw, dh);

    // véu de cor (se fundo aleatório foi escolhido)
    if (estado.fundoRand) {
      ctx.save();
      ctx.globalAlpha = veu;
      ctx.fillStyle = rgbParaCss(cores.fundo);
      ctx.fillRect(0, 0, w, h);
      ctx.restore();
    }
  } else {
    ctx.fillStyle = rgbParaCss(cores.fundo);
    ctx.fillRect(0, 0, w, h);
  }

  // 2) ajusta tamanho da fonte
  const larguraMax = w * 0.8;
  const alturaMax  = h * 0.6;
  let tamanho = Math.min(w, h) * 0.25;
  let fonte;
  while (tamanho > 10) {
    fonte = `700 ${tamanho}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
    ctx.font = fonte;
    const m = ctx.measureText(palavra);
    const larguraTexto = m.width;
    const alturaTexto  = (m.actualBoundingBoxAscent || tamanho*0.8)
                       + (m.actualBoundingBoxDescent || tamanho*0.2);
    if (larguraTexto <= larguraMax && alturaTexto <= alturaMax) break;
    tamanho -= 4;
  }
  ctx.font = fonte;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const cx = w / 2;
  const cy = h / 2;

  // 3) sombra (opcional, útil sobre foto)
  if (sombra && imagemFundo) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    const desloc = Math.max(2, tamanho * 0.02);
    ctx.fillText(palavra, cx + desloc, cy + desloc);
  }

  // 4) texto principal
  ctx.fillStyle = rgbParaCss(cores.texto);
  ctx.fillText(palavra, cx, cy);
}

// =========================================================
//  Sorteia uma lista de cores (uma por palavra)
// =========================================================
function sortearCores() {
  const lista = [];
  for (let i = 0; i < estado.palavras.length; i++) {
    lista.push({
      fundo: estado.fundoRand
        ? corAleatoria(estado.tom, false)
        : estado.corFundo,
      texto: estado.textoRand
        ? corAleatoria(estado.tom, true)
        : estado.corTexto,
    });
  }
  return lista;
}

// =========================================================
//  Renderiza um slide específico
// =========================================================
function renderSlide(indice) {
  const dpr = window.devicePixelRatio || 1;
  // Ajusta canvas ao tamanho real da tela respeitando a proporção escolhida
  const proporcao = estado.largura / estado.altura;
  let w = window.innerWidth;
  let h = w / proporcao;
  if (h > window.innerHeight) {
    h = window.innerHeight;
    w = h * proporcao;
  }
  canvasSlide.style.width  = w + 'px';
  canvasSlide.style.height = h + 'px';
  canvasSlide.style.left = ((window.innerWidth - w)/2) + 'px';
  canvasSlide.style.top  = ((window.innerHeight - h)/2) + 'px';
  canvasSlide.width  = Math.round(w * dpr);
  canvasSlide.height = Math.round(h * dpr);
  ctxSlide.setTransform(dpr, 0, 0, dpr, 0, 0);

  const palavra = estado.palavras[indice];
  const cores = estado.coresGeradas[indice];
  desenharImagem(ctxSlide, w, h, palavra, cores,
                 estado.imagemFundo, estado.veu, estado.sombra);

  el('contador').textContent = `${indice + 1} / ${estado.palavras.length}`;
}

// =========================================================
//  Controle do slide
// =========================================================
function abrirSlide() {
  // Valida palavras
  const texto = el('palavras').value.trim();
  if (!texto) { alert('Digite ao menos uma palavra.'); return; }
  estado.palavras = texto.replace(/\n/g, ',').split(',')
                        .map(s => s.trim()).filter(Boolean);
  if (estado.palavras.length === 0) { alert('Nenhuma palavra válida.'); return; }

  // Coleta configurações
  estado.largura  = Math.max(200, parseInt(el('largura').value) || 1080);
  estado.altura   = Math.max(200, parseInt(el('altura').value)  || 1080);
  estado.corFundo = hexParaRgb(el('corFundo').value);
  estado.corTexto = hexParaRgb(el('corTexto').value);
  estado.fundoRand= el('fundoRand').checked;
  estado.textoRand= el('textoRand').checked;
  estado.tom      = el('tom').value;
  estado.veu      = parseFloat(el('veu').value);
  estado.sombra   = el('sombra').checked;
  estado.intervalo= parseFloat(el('intervalo').value) || 3;

  // Sorteia as cores
  estado.coresGeradas = sortearCores();
  estado.indiceAtual = 0;

  el('slide').classList.add('ativo');
  el('btnBaixarTodas').disabled = false;
  renderSlide(0);
}

function fecharSlide() {
  pararAutoPlay();
  el('slide').classList.remove('ativo');
}

function proximo() {
  estado.indiceAtual = (estado.indiceAtual + 1) % estado.palavras.length;
  renderSlide(estado.indiceAtual);
}
function anterior() {
  estado.indiceAtual = (estado.indiceAtual - 1 + estado.palavras.length)
                       % estado.palavras.length;
  renderSlide(estado.indiceAtual);
}

function iniciarAutoPlay() {
  if (estado.autoPlay) return;
  estado.autoPlay = true;
  el('btnAutoPlay').textContent = '⏸ Pausar';
  estado.timerAuto = setInterval(() => {
    proximo();
  }, estado.intervalo * 1000);
}
function pararAutoPlay() {
  estado.autoPlay = false;
  el('btnAutoPlay').textContent = '▶ Auto';
  if (estado.timerAuto) { clearInterval(estado.timerAuto); estado.timerAuto = null; }
}

// =========================================================
//  Download
// =========================================================
function baixarImagem(indice) {
  const canvas = document.createElement('canvas');
  canvas.width  = estado.largura;
  canvas.height = estado.altura;
  const ctx = canvas.getContext('2d');
  desenharImagem(ctx, estado.largura, estado.altura,
                 estado.palavras[indice],
                 estado.coresGeradas[indice],
                 estado.imagemFundo, estado.veu, estado.sombra);

  const nome = String(indice + 1).padStart(2, '0') + '_' +
               estado.palavras[indice].replace(/[^\w\-]+/g, '_') + '.png';
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nome;
    a.click();
    URL.revokeObjectURL(url);
  }, 'image/png');
}

async function baixarTodas() {
  if (!estado.palavras.length) return;
  const btn = el('btnBaixarTodas');
  btn.disabled = true;
  const original = btn.textContent;
  for (let i = 0; i < estado.palavras.length; i++) {
    btn.textContent = `⬇ Baixando ${i+1}/${estado.palavras.length}…`;
    baixarImagem(i);
    // Pequena pausa para o navegador não engasgar com muitos downloads
    await new Promise(r => setTimeout(r, 250));
  }
  btn.textContent = original;
  btn.disabled = false;
  el('status').textContent = `Baixadas ${estado.palavras.length} imagens.`;
}

// =========================================================
//  Upload da imagem de fundo
// =========================================================
el('arquivoFundo').addEventListener('change', ev => {
  const file = ev.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    estado.imagemFundo = img;
    el('btnRemoverFundo').disabled = false;
    el('status').textContent = `Imagem de fundo carregada: ${file.name}`;
  };
  img.src = URL.createObjectURL(file);
});
el('btnRemoverFundo').addEventListener('click', () => {
  estado.imagemFundo = null;
  el('arquivoFundo').value = '';
  el('btnRemoverFundo').disabled = true;
  el('status').textContent = 'Imagem de fundo removida.';
});

// Slider de véu
el('veu').addEventListener('input', ev => {
  el('veuValor').textContent = parseFloat(ev.target.value).toFixed(2);
});

// =========================================================
//  Listeners gerais
// =========================================================
el('btnIniciar').addEventListener('click', abrirSlide);
el('btnSair').addEventListener('click', fecharSlide);
el('btnProximo').addEventListener('click', proximo);
el('btnAnterior').addEventListener('click', anterior);
el('btnAutoPlay').addEventListener('click', () => {
  estado.autoPlay ? pararAutoPlay() : iniciarAutoPlay();
});
el('btnBaixarAtual').addEventListener('click', () => baixarImagem(estado.indiceAtual));
el('btnBaixarTodas').addEventListener('click', baixarTodas);

// Clique no canvas = próximo (a menos que tenha clicado nos controles)
canvasSlide.addEventListener('click', () => {
  if (estado.autoPlay) { pararAutoPlay(); return; }
  proximo();
});

// Teclado
document.addEventListener('keydown', ev => {
  if (!el('slide').classList.contains('ativo')) return;
  if (ev.key === 'Escape') fecharSlide();
  else if (ev.key === 'ArrowRight' || ev.key === ' ') { ev.preventDefault(); proximo(); }
  else if (ev.key === 'ArrowLeft')  { ev.preventDefault(); anterior(); }
  else if (ev.key.toLowerCase() === 'a') {
    estado.autoPlay ? pararAutoPlay() : iniciarAutoPlay();
  }
  else if (ev.key.toLowerCase() === 'f') {
    if (!document.fullscreenElement) el('slide').requestFullscreen();
    else document.exitFullscreen();
  }
  else if (ev.key.toLowerCase() === 'b') baixarImagem(estado.indiceAtual);
});

// Redimensionamento da janela
window.addEventListener('resize', () => {
  if (el('slide').classList.contains('ativo')) {
    renderSlide(estado.indiceAtual);
  }
});
</script>
</body>
</html>
